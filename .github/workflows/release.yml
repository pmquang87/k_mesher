name: release

# Cut a release either by pushing a version tag:
#   git tag v0.6.0 && git push origin v0.6.0
# or by dispatching this workflow on main ("Run workflow" in the Actions tab)
# — the dispatch path derives the tag from k_mesher/_version.py and
# `gh release create` creates the tag itself.
# Builds the sdist + wheel, checks them, verifies the tag matches
# k_mesher/_version.py, creates a GitHub Release with the artifacts, and
# publishes to PyPI via Trusted Publishing (the `pypi` job needs the trusted
# publisher configured on pypi.org — see CONTRIBUTING.md; the GitHub Release
# succeeds regardless).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the release tag (and check it matches the version)
        run: |
          PKG_VERSION=$(python -c "import runpy; print(runpy.run_path('k_mesher/_version.py')['__version__'])")
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
            if [ "${TAG#v}" != "$PKG_VERSION" ]; then
              echo "Tag $TAG does not match _version.py ($PKG_VERSION)" >&2
              exit 1
            fi
          else
            # workflow_dispatch: only from main; tag derived from _version.py
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Dispatch releases only from main (got $GITHUB_REF)" >&2
              exit 1
            fi
            TAG="v$PKG_VERSION"
            if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists - bump _version.py first" >&2
              exit 1
            fi
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build and check the distributions
        run: |
          pip install -U build twine packaging
          python -m build
          twine check dist/*

      - name: Smoke-test the wheel (console entry point)
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libgl1 libxrender1 \
            libxcursor1 libxft2 libxinerama1 libfontconfig1
          pip install dist/*.whl
          k-mesher --version

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # --target creates the tag at this commit on dispatch runs; it is
        # ignored when the tag already exists (tag-push runs)
        run: |
          gh release create "$TAG" dist/* \
            --title "k_mesher $TAG" --generate-notes --target "$GITHUB_SHA"

  pypi:
    # Publishes via PyPI Trusted Publishing (OIDC). Requires the trusted
    # publisher to be configured on pypi.org for this repo + workflow;
    # until then this job fails while the GitHub Release above still ships.
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
