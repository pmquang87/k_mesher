name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries for gmsh + headless GUI (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libgl1 libxrender1 \
            libxcursor1 libxft2 libxinerama1 libfontconfig1 xvfb

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests (Linux, under Xvfb for the GUI tests)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest tests/ -v

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: pytest tests/ -v
