[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "k-mesher"
dynamic = ["version"]
description = "Mesh STEP/IGES/BREP/STL geometry to LS-DYNA .k files (TET4/TET10 solids, TRI3/QUAD4 shells) with symmetry, defeaturing, BCs/loads and quality checks - built on gmsh"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Minh Quang Pham", email = "pmquang87@gmail.com" },
]
keywords = [
    "mesh",
    "LS-DYNA",
    "gmsh",
    "STEP",
    "FEA",
    "CAD",
    "tetrahedra",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "gmsh>=4.13",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/pmquang87/k_mesher"
Repository = "https://github.com/pmquang87/k_mesher"
"Bug Tracker" = "https://github.com/pmquang87/k_mesher/issues"

[project.optional-dependencies]
# FE-format bridge (Nastran / Abaqus / VTK ...): k_mesher.mesh_io
io = ["meshio>=5"]
# d3plot / binout post-processing: k_mesher.post
post = ["lasso-python>=2"]
# faster connection detection (KD-tree) and convergence plots
extras = ["scipy>=1.10", "matplotlib>=3.6"]
all = ["meshio>=5", "lasso-python>=2", "scipy>=1.10", "matplotlib>=3.6"]

[project.scripts]
k-mesher = "k_mesher.mesh_cli:cli_entry"
k-mesher-doe = "k_mesher.doe:main"
k-mesher-convert = "k_mesher.mesh_io:main"
k-mesher-post = "k_mesher.post_viz:main"

[project.gui-scripts]
k-mesher-gui = "k_mesher.gui:main"

[tool.setuptools]
packages = ["k_mesher"]

[tool.setuptools.dynamic]
version = { attr = "k_mesher._version.__version__" }
